# Allow legacy transient non-exclusive queues.
# RabbitMQ 4.2 deprecates transient non-exclusive classic queues,
# but Celery 5.x still declares them.
# This setting preserves compatibility with existing Celery 5.x workers
# after upgrading RabbitMQ from 3.9 to 4.2.
deprecated_features.permit.transient_nonexcl_queues = true

# Enable legacy management metrics collector (used by RabbitMQ UI).
# Prometheus metrics are available separately via rabbitmq_prometheus plugin
# and should be used for centralized monitoring (Prometheus/Grafana).
management_agent.disable_metrics_collector = false
